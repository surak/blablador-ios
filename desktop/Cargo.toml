[package]
name = "blablador"
version = "3.10.0"
edition = "2021"
description = "Blablador chat client for Windows and Linux"
license = "MIT"

[dependencies]
blablador-models = { path = "../shared" }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
egui_commonmark = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
regex = "1"
url = "2"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
flate2 = "1"
directories = "5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
rfd = "0.15"
pdf-extract = "0.7"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
