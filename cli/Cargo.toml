[package]
name = "bla"
version = "3.8.0"
edition = "2021"
rust-version = "1.80"
description = "Blablador on the command line: a small, fast coding agent where everything is a plugin"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
directories = "5"
ctrlc = "3"
rustyline = { version = "14", default-features = false, features = ["with-file-history"] }
rpassword = "7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
