[package]
name = "bla"
version = "3.11.0"
edition = "2021"
rust-version = "1.80"
description = "Blablador on the command line: a small, fast coding agent where everything is a plugin"
license = "MIT"

[dependencies]
blablador-models = { path = "../shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
directories = "5"
ctrlc = "3"
rpassword = "7"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
unicode-width = "0.2"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
cpal = "0.15"
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
