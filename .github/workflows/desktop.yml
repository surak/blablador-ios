# Builds the Rust desktop app (desktop/) and the bla command line (cli/) for Windows, Linux (x86-64 and 64-bit ARM,
# e.g. Raspberry Pi) and macOS, plus a Windows installer with both, and attaches them to the release, adding their checksums to SHA256SUMS.txt.
name: Desktop

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the builds to (empty builds without attaching)
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64-desktop
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libdbus-1-dev
      - run: cargo test --release
      - run: cargo build --release --target ${{ matrix.target }}
      - name: The app opens its window (no GPU here, as on many office PCs)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:BLABLADOR_NO_DIALOG = '1'
          $p = Start-Process target/${{ matrix.target }}/release/blablador.exe -PassThru
          Start-Sleep 15
          if ($p.HasExited) { Get-ChildItem $env:APPDATA -Recurse -Filter blablador-error.log | Get-Content; throw "the app quit at start (exit $($p.ExitCode))" }
          Stop-Process $p
      - name: Typing reaches the message box
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:BLABLADOR_NO_DIALOG = '1'
          $env:BLABLADOR_INPUT_PROBE = "$env:RUNNER_TEMP\typed.txt"
          $p = Start-Process target/${{ matrix.target }}/release/blablador.exe -PassThru
          Start-Sleep 15
          $shell = New-Object -ComObject WScript.Shell
          $null = $shell.AppActivate($p.Id)
          Start-Sleep 2
          $shell.SendKeys('hello ovo')
          Start-Sleep 3
          $typed = Get-Content $env:BLABLADOR_INPUT_PROBE -Raw -ErrorAction SilentlyContinue
          Stop-Process $p -ErrorAction SilentlyContinue
          Write-Host "composer holds: [$typed]"
          if ($typed -notmatch 'hello ovo') { throw "typing did not reach the message box" }
      - name: Package
        id: package
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          name="Blablador-$version-${{ matrix.platform }}"
          mkdir "$name"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/${{ matrix.target }}/release/blablador.exe "$name/Blablador.exe"
            7z a "$name.zip" "$name" >/dev/null
            echo "file=$name.zip" >> "$GITHUB_OUTPUT"
          else
            cp target/${{ matrix.target }}/release/blablador "$name/blablador"
            tar czf "$name.tar.gz" "$name"
            echo "file=$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: desktop/${{ steps.package.outputs.file }}

  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libasound2-dev pkg-config
      - run: cargo test --release
        if: matrix.target != 'x86_64-apple-darwin'
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        id: package
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          name="Blablador-$version-bla-${{ matrix.platform }}"
          mkdir "$name"
          cp README.md PLUGINS.md "$name/"
          # The bare program is released next to the archive: `bla update` downloads it, checks it against
          # SHA256SUMS.txt and writes it over itself, without needing a tar or zip library to unpack it.
          if [ "$RUNNER_OS" = Windows ]; then
            bare="bla-$version-${{ matrix.platform }}.exe"
            cp target/${{ matrix.target }}/release/bla.exe "$name/bla.exe"
            cp target/${{ matrix.target }}/release/bla.exe "$bare"
            7z a "$name.zip" "$name" >/dev/null
            echo "file=$name.zip" >> "$GITHUB_OUTPUT"
          else
            bare="bla-$version-${{ matrix.platform }}"
            cp target/${{ matrix.target }}/release/bla "$name/bla"
            cp target/${{ matrix.target }}/release/bla "$bare"
            tar czf "$name.tar.gz" "$name"
            echo "file=$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi
          echo "bare=$bare" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: bla-${{ matrix.platform }}
          path: |
            cli/${{ steps.package.outputs.file }}
            cli/${{ steps.package.outputs.bare }}

  windows-setup:
    # The installer Windows users download: the app and bla in one setup.exe (desktop/windows/blablador.iss).
    needs: [build, cli]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
          merge-multiple: true
          pattern: '*windows-x86_64'
      - name: Build the installer
        run: |
          version=$(grep -m1 '^version' desktop/Cargo.toml | cut -d'"' -f2)
          mkdir files
          7z e -y parts/Blablador-$version-windows-x86_64.zip -ofiles Blablador.exe -r >/dev/null
          7z e -y parts/Blablador-$version-bla-windows-x86_64.zip -ofiles bla.exe -r >/dev/null
          ls files
          choco install innosetup -y --no-progress >/dev/null
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" -Q "-DVersion=$version" "-DSource=$(cygpath -w "$PWD/files")" "-O$(cygpath -w "$PWD")" desktop/windows/blablador.iss
          # Also under a name without the version, so releases/latest/download/Blablador-windows-setup.exe always works.
          cp Blablador-$version-windows-setup.exe Blablador-windows-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: Blablador-*windows-setup.exe

  release:
    needs: [build, cli, windows-setup]
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Upload and update SHA256SUMS.txt
        run: |
          cd assets
          gh release upload "$TAG" * --clobber -R "$GITHUB_REPOSITORY"
          gh release download "$TAG" -p SHA256SUMS.txt -R "$GITHUB_REPOSITORY" -D sums || true
          touch sums/SHA256SUMS.txt
          for file in Blablador-* bla-*; do
            grep -v " $file\$" sums/SHA256SUMS.txt > sums/next.txt || true
            sha256sum "$file" >> sums/next.txt
            mv sums/next.txt sums/SHA256SUMS.txt
          done
          gh release upload "$TAG" sums/SHA256SUMS.txt --clobber -R "$GITHUB_REPOSITORY"
